<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 320 360" width="320" height="360" role="img" aria-label="Locky · 愤怒 Angry"><title>Locky · 愤怒 Angry</title><desc>Locky 的 愤怒 表情形态 · animated expression form</desc><style>
.ex-motion { animation: ex-shake 0.24s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
