<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 320 360" width="320" height="360" role="img" aria-label="Locky · 捂脸 Facepalm"><title>Locky · 捂脸 Facepalm</title><desc>Locky 的 捂脸 表情形态 · animated expression form</desc><style>
.ex-motion { animation: ex-headshake 0.9s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
