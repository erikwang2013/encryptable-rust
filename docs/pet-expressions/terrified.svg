<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 320 360" width="320" height="360" role="img" aria-label="Locky · 惊恐 Terrified"><title>Locky · 惊恐 Terrified</title><desc>Locky 的 惊恐 表情形态 · animated expression form</desc><style>
