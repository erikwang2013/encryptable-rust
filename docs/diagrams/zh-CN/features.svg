<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 620" role="img" aria-labelledby="t d" font-family="ui-sans-serif,-apple-system,'Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif">
  <title id="t">功能设计</title>
  <desc id="d">九张功能卡片：应用侧 AEAD、DB 侧确定性加密、SQL 片段生成、密钥轮换、类型信封、双格式隔离、8 个框架集成、CLI 工具、项目宠物 Locky。页脚注明默认依赖只有 4 个。</desc>

  <rect x="0.5" y="0.5" width="1019" height="619" rx="18" fill="#F8FAFF" stroke="#C7D2FE" stroke-width="1"/>

  <text x="510" y="48" text-anchor="middle" font-size="21" font-weight="700" fill="#312E81">功能设计</text>
  <text x="510" y="74" text-anchor="middle" font-size="13" fill="#64748B">九项核心能力 · Feature design</text>

  <!-- 1. 应用侧 AEAD -->
  <rect x="40" y="100" width="298" height="120" rx="14" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.5"/>
  <rect x="60" y="120" width="48" height="5" rx="2.5" fill="#10B981"/>
  <text x="60" y="148" font-size="15" font-weight="700" fill="#312E81">应用侧 AEAD 加密</text>
  <text x="60" y="178" font-size="12" fill="#475569">AES-256-GCM · 随机 96 位 nonce</text>
  <text x="60" y="198" font-size="12" fill="#64748B">认证 tag 即完整性校验</text>

  <!-- 2. DB 侧确定性加密 -->
  <rect x="361" y="100" width="298" height="120" rx="14" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.5"/>
  <rect x="381" y="120" width="48" height="5" rx="2.5" fill="#5B21B6"/>
  <text x="381" y="148" font-size="15" font-weight="700" fill="#312E81">DB 侧确定性加密</text>
  <text x="381" y="178" font-size="12" fill="#475569">AES-256-ECB · 同明文同密文</text>
  <text x="381" y="198" font-size="12" fill="#64748B">可绑进 WHERE 条件</text>

  <!-- 3. SQL 片段生成 -->
  <rect x="682" y="100" width="298" height="120" rx="14" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.5"/>
  <rect x="702" y="120" width="48" height="5" rx="2.5" fill="#5B21B6"/>
  <text x="702" y="148" font-size="15" font-weight="700" fill="#312E81">SQL 片段生成</text>
  <text x="702" y="178" font-size="12" fill="#475569">MySQL 与 PostgreSQL 两方言</text>
  <text x="702" y="198" font-size="12" fill="#64748B">列名白名单 col whitelist</text>

  <!-- 4. 密钥轮换 -->
  <rect x="40" y="242" width="298" height="120" rx="14" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.5"/>
  <rect x="60" y="262" width="48" height="5" rx="2.5" fill="#5B21B6"/>
  <text x="60" y="290" font-size="15" font-weight="700" fill="#312E81">密钥轮换 Key rotation</text>
  <text x="60" y="320" font-size="12" fill="#475569">主密钥 + previous_keys 环</text>
  <text x="60" y="340" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#64748B">rotate_to_current_key · 零停机</text>

  <!-- 5. 类型信封 -->
  <rect x="361" y="242" width="298" height="120" rx="14" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.5"/>
  <rect x="381" y="262" width="48" height="5" rx="2.5" fill="#5B21B6"/>
  <text x="381" y="290" font-size="15" font-weight="700" fill="#312E81">类型信封 Typed envelope</text>
  <text x="381" y="320" font-size="12" fill="#475569">1 字节 tag 记住类型</text>
  <text x="381" y="340" font-size="12" fill="#64748B">不做静默类型转换</text>

  <!-- 6. 双格式隔离 -->
  <rect x="682" y="242" width="298" height="120" rx="14" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.5"/>
  <rect x="702" y="262" width="48" height="5" rx="2.5" fill="#5B21B6"/>
  <text x="702" y="290" font-size="15" font-weight="700" fill="#312E81">双格式隔离</text>
  <text x="702" y="320" font-size="12" fill="#475569">0x01 / 0x02 格式字节</text>
  <text x="702" y="340" font-size="12" fill="#64748B">混用直接报错</text>

  <!-- 7. 8 个框架集成 -->
  <rect x="40" y="384" width="298" height="120" rx="14" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.5"/>
  <rect x="60" y="404" width="48" height="5" rx="2.5" fill="#5B21B6"/>
  <text x="60" y="432" font-size="15" font-weight="700" fill="#312E81">8 个框架集成</text>
  <text x="60" y="462" font-size="12" fill="#475569">axum · actix-web · rocket · poem</text>
  <text x="60" y="482" font-size="12" fill="#64748B">salvo · warp · bee-rust · e-cat</text>

  <!-- 8. CLI -->
  <rect x="361" y="384" width="298" height="120" rx="14" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.5"/>
  <rect x="381" y="404" width="48" height="5" rx="2.5" fill="#5B21B6"/>
  <text x="381" y="432" font-size="15" font-weight="700" fill="#312E81">CLI 工具</text>
  <text x="381" y="462" font-size="12" fill="#475569">keygen · encrypt · decrypt · rotate</text>
  <text x="381" y="482" font-size="12" fill="#64748B">db-encrypt · db-decrypt · sql · pet</text>

  <!-- 9. 项目宠物 -->
  <rect x="682" y="384" width="298" height="120" rx="14" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.5"/>
  <rect x="702" y="404" width="48" height="5" rx="2.5" fill="#F59E0B"/>
  <text x="702" y="432" font-size="15" font-weight="700" fill="#312E81">项目宠物 Locky</text>
  <text x="702" y="462" font-size="12" fill="#475569">小锁灵 · pet::SVG 内联进 crate</text>
  <text x="702" y="482" font-size="12" fill="#64748B">编译进 crate，无需外部文件</text>

  <!-- 页脚 -->
  <rect x="40" y="528" width="940" height="52" rx="14" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="510" y="560" text-anchor="middle" font-size="14" font-weight="600" fill="#92400E">默认依赖只有 4 个 · only 4 default dependencies</text>
</svg>
