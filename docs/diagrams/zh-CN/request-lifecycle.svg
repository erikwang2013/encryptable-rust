<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1010" width="1100" height="1010" role="img" aria-labelledby="t d">
  <title id="t">请求周期 — Encryptable / Request lifecycle</title>
  <desc id="d">从左到右的请求流程：HTTP 请求 → 框架路由 → 守卫提取 → 处理器，之后分叉为写路径与读路径，两条路径都经过数据库，最后返回响应。两条失败路径用玫瑰色虚线标出：守卫没有注册进 state 得到 500；tag 校验失败或环上没有钥匙能解开时，由处理器决定返回什么。</desc>

  <rect x="4" y="4" width="1092" height="1002" rx="16" fill="#F8FAFF" stroke="#C7D2FE" stroke-width="1.5"/>

  <text x="30" y="50" font-family="ui-sans-serif,-apple-system,'Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#312E81">请求周期</text>
  <text x="30" y="72" font-family="ui-sans-serif,-apple-system,'Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#5B21B6">Request lifecycle · 从 HTTP 请求进入，到响应返回</text>

  <!-- ===== 主路径第 1 段：请求 → 路由 → 提取 → 处理器 ===== -->
  <g>
    <rect x="30" y="100" width="237" height="126" rx="12" fill="#FFFFFF" stroke="#1E1B4B" stroke-width="1.8"/>
    <circle cx="58" cy="128" r="13" fill="#5B21B6"/>
    <text x="58" y="133" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">1</text>
    <text x="80" y="133" font-family="ui-sans-serif,-apple-system,'Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#312E81">HTTP 请求</text>
    <text x="46" y="168" font-family="ui-sans-serif,-apple-system,'Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" fill="#1E1B4B">携带密文或明文</text>
  </g>

  <path d="M267,163 H287" fill="none" stroke="#1E1B4B" stroke-width="1.6"/>
  <path d="M296,163 l-9,-5 l0,10 z" fill="#1E1B4B"/>

  <g>
    <rect x="297" y="100" width="237" height="126" rx="12" fill="#FFFFFF" stroke="#1E1B4B" stroke-width="1.8"/>
    <circle cx="325" cy="128" r="13" fill="#5B21B6"/>
    <text x="325" y="133" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">2</text>
    <text x="347" y="133" font-family="ui-sans-serif,-apple-system,'Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#312E81">框架路由</text>
    <text x="313" y="164" font-family="ui-sans-serif,-apple-system,'Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" fill="#1E1B4B">axum · actix-web · rocket</text>
    <text x="313" y="182" font-family="ui-sans-serif,-apple-system,'Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" fill="#1E1B4B">poem · salvo · warp</text>
    <text x="313" y="200" font-family="ui-sans-serif,-apple-system,'Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" fill="#1E1B4B">bee-rust · e-cat</text>
  </g>

  <path d="M534,163 H554" fill="none" stroke="#1E1B4B" stroke-width="1.6"/>
  <path d="M563,163 l-9,-5 l0,10 z" fill="#1E1B4B"/>

  <g>
    <rect x="564" y="100" width="237" height="126" rx="12" fill="#FFFFFF" stroke="#1E1B4B" stroke-width="1.8"/>
    <circle cx="592" cy="128" r="13" fill="#5B21B6"/>
    <text x="592" y="133" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">3</text>
    <text x="614" y="133" font-family="ui-sans-serif,-apple-system,'Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#312E81">守卫提取</text>
    <text x="580" y="164" font-family="ui-sans-serif,-apple-system,'Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" fill="#1E1B4B">适配层调用 Guarded::guard()</text>
    <text x="580" y="182" font-family="ui-sans-serif,-apple-system,'Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" fill="#1E1B4B">克隆一次 Arc：引用计数 +1</text>
    <text x="580" y="200" font-family="ui-sans-serif,-apple-system,'Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" fill="#1E1B4B">无密钥拷贝</text>
  </g>

  <path d="M801,163 H821" fill="none" stroke="#1E1B4B" stroke-width="1.6"/>
  <path d="M830,163 l-9,-5 l0,10 z" fill="#1E1B4B"/>

  <g>
    <rect x="831" y="100" width="237" height="126" rx="12" fill="#FFFFFF" stroke="#1E1B4B" stroke-width="1.8"/>
    <circle cx="859" cy="128" r="13" fill="#5B21B6"/>
    <text x="859" y="133" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">4</text>
    <text x="881" y="133" font-family="ui-sans-serif,-apple-system,'Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#312E81">处理器</text>
    <text x="847" y="168" font-family="ui-sans-serif,-apple-system,'Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" fill="#1E1B4B">async fn h(guard: Guard)</text>
  </g>

  <!-- ===== 分叉：写 / 读 ===== -->
  <path d="M950,226 V282 H425 V307" fill="none" stroke="#1E1B4B" stroke-width="1.6"/>
  <path d="M425,316 l-5,-9 l10,0 z" fill="#1E1B4B"/>
  <path d="M825,282 V307" fill="none" stroke="#1E1B4B" stroke-width="1.6"/>
  <path d="M825,316 l-5,-9 l10,0 z" fill="#1E1B4B"/>

  <!-- 写路径 -->
  <g>
    <rect x="250" y="316" width="350" height="170" rx="12" fill="#FFFFFF" stroke="#1E1B4B" stroke-width="1.8"/>
    <circle cx="278" cy="344" r="13" fill="#5B21B6"/>
    <text x="278" y="349" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">5</text>
    <text x="300" y="349" font-family="ui-sans-serif,-apple-system,'Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#312E81">写 · guard.encrypt(明文)</text>
    <text x="266" y="382" font-family="ui-sans-serif,-apple-system,'Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" fill="#1E1B4B">明文 → 类型信封 tag(1B)‖载荷</text>
    <text x="266" y="404" font-family="ui-sans-serif,-apple-system,'Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" fill="#1E1B4B">随机 nonce(12) + AES-256-GCM</text>
    <text x="266" y="426" font-family="ui-sans-serif,-apple-system,'Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" fill="#1E1B4B">→ base64(0x01‖nonce‖密文‖tag)</text>
    <text x="266" y="456" font-family="ui-sans-serif,-apple-system,'Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#94A3B8">每次写入 nonce 都不同</text>
  </g>

  <!-- 读路径 -->
  <g>
    <rect x="650" y="316" width="350" height="170" rx="12" fill="#FFFFFF" stroke="#1E1B4B" stroke-width="1.8"/>
    <circle cx="678" cy="344" r="13" fill="#5B21B6"/>
    <text x="678" y="349" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">5</text>
    <text x="700" y="349" font-family="ui-sans-serif,-apple-system,'Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#312E81">读 · guard.decrypt_text(密文)</text>
    <text x="666" y="382" font-family="ui-sans-serif,-apple-system,'Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" fill="#1E1B4B">校验 tag → 逐把钥匙试密钥环</text>
    <text x="666" y="404" font-family="ui-sans-serif,-apple-system,'Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" fill="#1E1B4B">→ 还原类型（严格模式失败即报错）</text>
    <text x="666" y="456" font-family="ui-sans-serif,-apple-system,'Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#94A3B8">不返回「解密失败的原文」</text>
  </g>

  <!-- ===== 汇入数据库 → 响应 ===== -->
  <path d="M425,486 V547" fill="none" stroke="#1E1B4B" stroke-width="1.6"/>
  <path d="M425,556 l-5,-9 l10,0 z" fill="#1E1B4B"/>
  <text x="437" y="524" font-family="ui-sans-serif,-apple-system,'Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#5B21B6">存入密文</text>

  <path d="M550,556 V521 H825 V495" fill="none" stroke="#1E1B4B" stroke-width="1.6"/>
  <path d="M825,486 l-5,9 l10,0 z" fill="#1E1B4B"/>
  <text x="600" y="513" font-family="ui-sans-serif,-apple-system,'Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#5B21B6">取出密文</text>

  <g>
    <rect x="250" y="556" width="350" height="130" rx="12" fill="#DBE2FF" stroke="#1E1B4B" stroke-width="1.8"/>
    <circle cx="278" cy="584" r="13" fill="#5B21B6"/>
    <text x="278" y="589" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">6</text>
    <text x="300" y="589" font-family="ui-sans-serif,-apple-system,'Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#312E81">数据库</text>
    <text x="266" y="622" font-family="ui-sans-serif,-apple-system,'Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" fill="#1E1B4B">列里存的是密文</text>
    <text x="266" y="644" font-family="ui-sans-serif,-apple-system,'Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" fill="#1E1B4B">（base64 文本，看不出类型）</text>
  </g>

  <path d="M600,621 H641" fill="none" stroke="#1E1B4B" stroke-width="1.6"/>
  <path d="M650,621 l-9,-5 l0,10 z" fill="#1E1B4B"/>

  <g>
    <rect x="650" y="556" width="350" height="130" rx="12" fill="#E8EDFF" stroke="#1E1B4B" stroke-width="1.8"/>
    <circle cx="678" cy="584" r="13" fill="#5B21B6"/>
    <text x="678" y="589" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">7</text>
    <text x="700" y="589" font-family="ui-sans-serif,-apple-system,'Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#312E81">响应</text>
    <text x="666" y="622" font-family="ui-sans-serif,-apple-system,'Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" fill="#1E1B4B">状态码与正文由处理器决定</text>
  </g>

  <!-- ===== 失败路径（玫瑰色虚线） ===== -->
  <path d="M660,226 V250 H90 V727" fill="none" stroke="#FB7185" stroke-width="1.8" stroke-dasharray="7 5"/>
  <path d="M90,736 l-5,-9 l10,0 z" fill="#FB7185"/>
  <text x="375" y="243" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#BE123C">守卫不在 state → GuardNotConfigured → 500</text>

  <path d="M1000,400 H1035 V727" fill="none" stroke="#FB7185" stroke-width="1.8" stroke-dasharray="7 5"/>
  <path d="M1035,736 l-5,-9 l10,0 z" fill="#FB7185"/>
  <text x="1022" y="512" text-anchor="end" font-family="ui-sans-serif,-apple-system,'Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#BE123C">tag 校验失败 / 环上没有钥匙</text>

  <g>
    <rect x="30" y="736" width="510" height="150" rx="12" fill="#FFF1F2" stroke="#FB7185" stroke-width="1.6"/>
    <path d="M52,758 L63,777 L41,777 Z" fill="#FB7185"/>
    <rect x="50.5" y="763" width="3" height="8" rx="1.5" fill="#FFFFFF"/>
    <rect x="50.5" y="773" width="3" height="3" rx="1.5" fill="#FFFFFF"/>
    <text x="76" y="775" font-family="ui-sans-serif,-apple-system,'Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#BE123C">守卫没注册进 state</text>
    <text x="48" y="805" font-family="ui-sans-serif,-apple-system,'Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" fill="#1E1B4B">→ GuardNotConfigured</text>
    <text x="48" y="826" font-family="ui-sans-serif,-apple-system,'Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" fill="#1E1B4B">→ HTTP 500</text>
    <text x="48" y="847" font-family="ui-sans-serif,-apple-system,'Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" fill="#1E1B4B">装配错误：不是调用方做错了什么，</text>
    <text x="48" y="866" font-family="ui-sans-serif,-apple-system,'Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" fill="#1E1B4B">而是应用忘了把守卫放进 state。</text>
  </g>

  <g>
    <rect x="570" y="736" width="500" height="150" rx="12" fill="#FFF1F2" stroke="#FB7185" stroke-width="1.6"/>
    <path d="M592,758 L603,777 L581,777 Z" fill="#FB7185"/>
    <rect x="590.5" y="763" width="3" height="8" rx="1.5" fill="#FFFFFF"/>
    <rect x="590.5" y="773" width="3" height="3" rx="1.5" fill="#FFFFFF"/>
    <text x="616" y="775" font-family="ui-sans-serif,-apple-system,'Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#BE123C">tag 校验失败 · 环上没有钥匙</text>
    <text x="588" y="805" font-family="ui-sans-serif,-apple-system,'Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" fill="#1E1B4B">→ 由处理器决定回什么：200 / 4xx / 5xx</text>
    <text x="588" y="826" font-family="ui-sans-serif,-apple-system,'Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" fill="#1E1B4B">本库不替应用决定响应。</text>
    <text x="588" y="847" font-family="ui-sans-serif,-apple-system,'Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" fill="#1E1B4B">严格模式失败即报错；宽松模式由调用方处置。</text>
  </g>

  <!-- ===== 页脚 ===== -->
  <rect x="30" y="916" width="1040" height="60" rx="12" fill="#312E81"/>
  <text x="550" y="952" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#E0E7FF">提取永不失手；加解密失败由调用方处置</text>
</svg>
